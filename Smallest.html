<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Document</title>
    </head>
    <body>
        <script>
            let a=10 
            let b=20
            let c=30
            let d=40
            let e=50

            if(a<b && a<c && a<d && a<e){
                console.log("A is Smallest");    
            }
            else if(b<a && b<c && b<d && b<e){
                console.log("B is Smallest");
            }
            else if(c<a && c<b && c<d && c<e){
                console.log("C is Smallest");    
            }
            else if(d<a && d<b && d<c && d<e){
                console.log("D is Smallest")
            }
            else{
                console.log("E is Smallest"); 
            }
                  
        </script>
    </body>
</html>
